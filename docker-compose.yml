# The whole app on your PC, the same way it runs on Railway: one app container
# (web + worker + ffmpeg) plus a database.
#
#   docker compose up --build
#   open http://localhost:3000
#
# Only ELEVENLABS_API_KEY is needed; put it in a .env file next to this one.
# The password is the one built into the app unless you set APP_PASSWORD here.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workbench']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://workbench:workbench@db:5432/workbench
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      APP_PASSWORD: ${APP_PASSWORD:-}
      AUDIO_DIR: /data/audio
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    ports:
      - '3000:3000'
    volumes:
      - audio-data:/data/audio
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  audio-data:
